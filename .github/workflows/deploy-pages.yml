# GitHub Pages
# ① Settings → Pages → Build and deployment → Source を「GitHub Actions」に必ず設定
# ② 未設定だと deploy ジョブが失敗します
# リポジトリ: https://github.com/takkenshiken2026-sudo/chintaikanrishi-master
# 本番: https://chintaikanrishi-master.jp/（CNAME）
name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-chintaikanrishi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate data and static question pages
        run: |
          python3 tools/csv_to_chintaikan_eisei_master.py
          python3 tools/glossary_csv_to_eisei_embed_js.py
          python3 tools/csv_to_eisei_ichimon_js.py
          python3 tools/build_past_question_pages.py
          python3 tools/build_glossary_pages.py

      - name: Bundle public files
        run: bash tools/prepare_public_site.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
